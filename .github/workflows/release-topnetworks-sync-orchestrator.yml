name: Release TopNetworks Sync Orchestrator

on:
  push:
    branches:
      - main
    paths:
      - 'skills/topnetworks-sync-orchestrator/**'
      - 'scripts/build-skill-artifact.sh'
      - '.github/workflows/release-topnetworks-sync-orchestrator.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact
        id: build
        run: |
          chmod +x scripts/build-skill-artifact.sh
          BUILD_OUTPUT=$(scripts/build-skill-artifact.sh)
          echo "$BUILD_OUTPUT"
          echo "artifact_name=$(echo \"$BUILD_OUTPUT\" | awk -F= '/^ARTIFACT_NAME=/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$(echo \"$BUILD_OUTPUT\" | awk -F= '/^CHECKSUM_NAME=/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "tag_version=$(echo \"$BUILD_OUTPUT\" | awk -F= '/^TAG_VERSION=/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "version=$(echo \"$BUILD_OUTPUT\" | awk -F= '/^VERSION=/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag_version }}
          name: topnetworks-sync-orchestrator ${{ steps.build.outputs.tag_version }}
          generate_release_notes: true
          prerelease: false
          files: |
            dist/${{ steps.build.outputs.artifact_name }}
            dist/${{ steps.build.outputs.checksum_name }}
