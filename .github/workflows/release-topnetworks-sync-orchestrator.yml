name: Release TopNetworks Sync Orchestrator

on:
  push:
    branches:
      - main
    paths:
      - 'skills/topnetworks-sync-orchestrator/**'
      - 'scripts/build-skill-artifact.sh'
      - '.github/workflows/release-topnetworks-sync-orchestrator.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact
        id: build
        run: |
          chmod +x scripts/build-skill-artifact.sh
          scripts/build-skill-artifact.sh > /tmp/build-output.env
          cat /tmp/build-output.env
          ARTIFACT_NAME=$(awk -F= '/^ARTIFACT_NAME=/{print $2}' /tmp/build-output.env)
          CHECKSUM_NAME=$(awk -F= '/^CHECKSUM_NAME=/{print $2}' /tmp/build-output.env)
          TAG_VERSION=$(awk -F= '/^TAG_VERSION=/{print $2}' /tmp/build-output.env)
          VERSION=$(awk -F= '/^VERSION=/{print $2}' /tmp/build-output.env)
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum_name=${CHECKSUM_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag_version }}
          name: topnetworks-sync-orchestrator ${{ steps.build.outputs.tag_version }}
          generate_release_notes: true
          prerelease: false
          files: |
            dist/${{ steps.build.outputs.artifact_name }}
            dist/${{ steps.build.outputs.checksum_name }}
